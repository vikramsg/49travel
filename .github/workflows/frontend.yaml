name: Frontend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The version the app is developed on, so the native DuckDB binding
          # the tests load is the same one that has been exercised locally.
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
